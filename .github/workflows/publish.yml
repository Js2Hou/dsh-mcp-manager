name: Publish to npm

# 推送到 GitHub 后自动发布到 npm：
#   1) 打标签  git tag v0.1.x && git push origin v0.1.x
#   2) 或手动  Actions → “Publish to npm” → Run workflow
# 需要先在仓库设置里配置 NPM_TOKEN secret（npmjs.com → Access tokens →
# Automation/publish token，且必须勾选 Bypass 2FA —— 无 2FA 账号发布必需）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      # pnpm 11 requires Node >= 22.13 (Node 20 fails instantly).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Only meaningful for tag-triggered runs; a manual dispatch has no tag
      # (GITHUB_REF_NAME is the branch), so it is skipped there.
      - name: Verify tag matches package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v${TAG} does not match package.json version ${PKG}"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
