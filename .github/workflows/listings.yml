name: Update marketplace listings

# Refreshes the marketplace badge block in README.md / README_EN.md once a
# day (or on demand): polls every marketplace in listings.json and commits
# the new badge state if it changed. Triggered changes never re-trigger this
# workflow (schedule/dispatch only) and never publish to npm (publish.yml
# only fires on v* tag pushes).

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  listings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Refresh README listings
        run: node scripts/check-listings.mjs --write
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit if changed
        run: |
          if git diff --quiet README.md README_EN.md; then
            echo "listings unchanged"
          else
            git config user.name "dsh-mcp-manager[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md README_EN.md
            git commit -m "chore: sync marketplace listings"
            git push
          fi
